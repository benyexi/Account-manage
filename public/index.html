<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>账号中心</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 登录 / 注册 -->
  <div id="auth-view" class="login-wrap hidden">
    <div class="login-card">
      <h1>账号中心</h1>
      <p class="login-sub">登录或注册一个账号</p>
      <div class="tabs">
        <button type="button" class="tab active" data-tab="login">登 录</button>
        <button type="button" class="tab" data-tab="register">注 册</button>
      </div>

      <form id="login-form">
        <label>用户名
          <input type="text" id="login-username" autocomplete="username" required />
        </label>
        <label>密码
          <input type="password" id="login-password" autocomplete="current-password" required />
        </label>
        <button type="submit" class="btn btn-primary btn-block">登 录</button>
        <p id="login-error" class="error-text"></p>
      </form>

      <form id="register-form" class="hidden">
        <label>用户名 <span class="hint">（3-32 位字母、数字、_ 或 -）</span>
          <input type="text" id="reg-username" autocomplete="username" required />
        </label>
        <label>密码
          <input type="password" id="reg-password" placeholder="至少 6 位" autocomplete="new-password" required />
        </label>
        <label>确认密码
          <input type="password" id="reg-confirm" autocomplete="new-password" required />
        </label>
        <label>昵称 <span class="hint">（选填）</span>
          <input type="text" id="reg-nickname" />
        </label>
        <label>邮箱 <span class="hint">（选填）</span>
          <input type="email" id="reg-email" />
        </label>
        <button type="submit" class="btn btn-primary btn-block">注 册</button>
        <p id="register-error" class="error-text"></p>
      </form>
    </div>
  </div>

  <!-- 游客个人中心 -->
  <div id="profile-view" class="layout hidden">
    <header class="topbar">
      <div class="brand">👤 账号中心</div>
      <div class="topbar-right">
        <span id="current-user"></span>
        <button id="btn-logout" class="btn btn-ghost">退出登录</button>
      </div>
    </header>

    <main class="content content-narrow">
      <section class="profile-card">
        <div class="profile-head">
          <div class="avatar" id="p-avatar"></div>
          <div>
            <div class="profile-name" id="p-username"></div>
            <span class="tag" id="p-role"></span>
            <span class="tag" id="p-status"></span>
          </div>
        </div>
        <dl class="profile-info">
          <div><dt>昵称</dt><dd id="p-nickname"></dd></div>
          <div><dt>邮箱</dt><dd id="p-email"></dd></div>
          <div><dt>注册时间</dt><dd id="p-created"></dd></div>
          <div><dt>最近登录</dt><dd id="p-lastlogin"></dd></div>
        </dl>
        <div class="profile-actions">
          <button id="btn-edit-profile" class="btn">编辑资料</button>
          <button id="btn-change-pwd" class="btn">修改密码</button>
        </div>
      </section>
    </main>
  </div>

  <!-- 编辑资料弹窗 -->
  <div id="profile-modal" class="modal-mask hidden">
    <form id="profile-form" class="modal">
      <h2>编辑资料</h2>
      <label>昵称 <input type="text" id="f-nickname" /></label>
      <label>邮箱 <input type="email" id="f-email" /></label>
      <p id="profile-form-error" class="error-text"></p>
      <div class="modal-actions">
        <button type="button" class="btn" data-close>取消</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>

  <!-- 修改密码弹窗 -->
  <div id="pwd-modal" class="modal-mask hidden">
    <form id="pwd-form" class="modal">
      <h2>修改密码</h2>
      <label>原密码 <input type="password" id="p-old" required /></label>
      <label>新密码 <input type="password" id="p-new" required placeholder="至少 6 位" /></label>
      <label>确认新密码 <input type="password" id="p-confirm" required /></label>
      <p id="pwd-form-error" class="error-text"></p>
      <div class="modal-actions">
        <button type="button" class="btn" data-close>取消</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
